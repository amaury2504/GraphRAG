name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.10"
      - run: uv sync --frozen
      # Lint, format, types, tests avec couverture, anti-contournement : une seule commande, la même
      # qu'en local. La mutation n'est pas lancée ici ; gitleaks a son workflow (pr-checks.yml).
      - run: uv run python scripts/gates.py --skip mutation --skip gitleaks

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.10"
      - run: uv sync --frozen
      - name: Start the full stack
        run: |
          cp .env.example .env
          docker compose --profile test up -d --build --wait
      - name: Integration tests
        # Against the throwaway Neo4j (neo4j-test, port 7688), like in local.
        run: |
          set -a; . ./.env; set +a
          NEO4J_URI=bolt://localhost:7688 uv run pytest -m integration
      - name: API health through the container
        run: curl --fail --silent --show-error http://localhost:8000/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
