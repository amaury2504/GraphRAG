[project]
name = "graphrag"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

# CPU-only torch on Linux (CI, Docker image); PyPI already ships CPU wheels for Windows.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not model'"
markers = [
    "integration: needs the docker compose services (run with -m integration)",
    "model: runs the real embedding model, downloaded on first use (run with -m model)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
